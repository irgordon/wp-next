name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, pdo_sqlite, fileinfo, gd, exif, phar, simplexml, tokenizer, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer test:assets
      - run: composer test:design
      - run: composer test:documents
      - run: composer test:images
      - run: composer test:accounts
      - run: composer test:portability
      - run: composer test:discovery
      - run: composer test:http
      - run: python3 tests/permalinks-http.py
      - run: python3 tests/profiles-taxonomy-http.py
      - run: python3 tests/upgrade-smoke.py
      - run: python3 tests/migration-regressions.py
      - name: Verify the matching FPM runtime
        run: php-fpm8.4 -v
      - run: sudo apt-get update && sudo apt-get install -y apache2 nginx
      - run: python3 tests/server-hardening.py nginx
      - run: python3 tests/apache-hardening.py apache2 /usr/lib/apache2/modules
      - name: Real PHP-FPM over HTTPS on both stacks
        run: >-
          composer test:deployment --
          --php "$(command -v php)"
          --fpm "$(command -v php-fpm8.4)"
          --nginx "$(command -v nginx)"
          --apache "$(command -v apache2)"
          --modules /usr/lib/apache2/modules
          --mime-types /etc/mime.types
          --evidence "${{ runner.temp }}/deployment-https"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-https-diagnostics
          path: ${{ runner.temp }}/deployment-https
          if-no-files-found: ignore
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:js
      - run: npm run test:builder
      - run: npm run test:widgets
      - run: npm run test:browser
      - run: npm run test:widgets:browser
      - run: npm run test:preview:browser
      - run: npm run test:pages:browser
